<!DOCTYPE html>
<html>
<head>
    <title>Cloud AI Sentiment Analyzer</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #667eea, #764ba2);
            min-height: 100vh;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            background: white;
            width: 500px;
            padding: 35px;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }

        h1 {
            color: #333;
        }

        p {
            color: #666;
        }

        textarea {
            width: 90%;
            height: 120px;
            padding: 15px;
            border-radius: 10px;
            border: 1px solid #ccc;
            resize: none;
            font-size: 16px;
        }

        button {
            margin-top: 20px;
            padding: 12px 30px;
            border: none;
            border-radius: 25px;
            background: #667eea;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #4c5fd5;
        }

        .result {
            margin-top: 25px;
            padding: 15px;
            border-radius: 10px;
            background: #f1f1f1;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>☁️ Cloud AI</h1>
    <h2>Sentiment Analyzer</h2>

    <p>Enter a sentence and analyze its sentiment.</p>

    <form method="POST">

        <textarea
            name="text"
            placeholder="Example: I really enjoyed this project!"
            required>{{ text }}</textarea>

        <br>

        <button type="submit">
            Analyze Sentiment
        </button>

    </form>

    {% if sentiment %}
    <div class="result">

        <h3>Analysis Result</h3>

        <p>
            <strong>{{ sentiment }}</strong>
        </p>

    </div>
    {% endif %}

</div>

</body>
</html>
